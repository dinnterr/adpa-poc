AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  ITS Adaptive Data Processing Algorithm (ADPA) POC
  Cloud-Edge Architecture for Master's Thesis

Resources:
  # 1. Вхідний потік (Kinesis Data Stream) - сюди генератор відправляє події
  ITSInputStream:
    Type: AWS::Kinesis::Stream
    Properties:
      Name: its-input-stream
      ShardCount: 1 # Для POC одного шарду достатньо

  # 2. Таблиця DynamoDB для зберігання стану та порогів алгоритму
  SystemStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: its-system-state
      AttributeDefinitions:
        - AttributeName: ConfigKey
          AttributeType: S
      KeySchema:
        - AttributeName: ConfigKey
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  # 3. Серце системи: ADPA Controller (Lambda)
  ADPAControllerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: adpa_controller/
      Handler: lambda_function.lambda_handler
      Runtime: python3.9
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          STATE_TABLE: !Ref SystemStateTable
      Policies:
        # Дозволяємо Лямбді читати з Kinesis, писати метрики в CloudWatch та викликати інші функції
        - KinesisReadPolicy:
            StreamName: !Ref ITSInputStream
        - DynamoDBCrudPolicy:
            TableName: !Ref SystemStateTable
        - CloudWatchPutMetricPolicy: {}
        - LambdaInvokePolicy:
            FunctionName: !Ref CriticalEventHandler
      Events:
        StreamEvent:
          Type: Kinesis
          Properties:
            Stream: !GetAtt ITSInputStream.Arn
            StartingPosition: LATEST
            BatchSize: 100 # Максимальна кількість подій, які забирає контролер за раз

  # 4. STREAM PATH: Лямбда для обробки виключно критичних подій (CRITICAL)
  CriticalEventHandler:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: critical_handler
      CodeUri: stream_path/
      Handler: critical_handler.lambda_handler
      Runtime: python3.9
      Timeout: 5
      MemorySize: 128
      Policies:
        - CloudWatchPutMetricPolicy: {}

  # 5. MICRO-BATCH PATH: Kinesis Firehose для накопичення некритичних даних і запису в S3
  # У цьому POC Firehose імітує мікробатчінг (замість підняття дорогого EMR Spark кластера)
  MicroBatchDeliveryStream:
    Type: AWS::KinesisFirehose::DeliveryStream
    Properties:
      DeliveryStreamType: DirectPut
      S3DestinationConfiguration:
        BucketARN: !GetAtt ITSDataLakeBucket.Arn
        RoleARN: !GetAtt FirehoseDeliveryRole.Arn
        BufferingHints:
          IntervalInSeconds: 60 # Базовий інтервал батчінгу
          SizeInMBs: 5
        Prefix: "microbatch-data/"

  # 6. S3 Bucket для ролі Data Lake
  ITSDataLakeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "its-datalake-poc-${AWS::AccountId}"

  # 7. IAM Роль для Firehose (необхідна для доступу до S3)
  FirehoseDeliveryRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: firehose.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: FirehoseS3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:ListBucketMultipartUploads
                  - s3:PutObject
                Resource:
                  - !GetAtt ITSDataLakeBucket.Arn
                  - !Sub "${ITSDataLakeBucket.Arn}/*"

Outputs:
  InputStreamName:
    Description: "Name of the Kinesis Stream to send data to"
    Value: !Ref ITSInputStream